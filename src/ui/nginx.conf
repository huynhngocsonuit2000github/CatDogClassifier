server {
    listen 4200;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing fallback: unknown paths (e.g. /registry, /prediction) serve the
    # Angular shell so the client-side router can resolve them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets aggressively; never cache the HTML shell.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /index.html {
        add_header Cache-Control "no-cache";
    }
}