# MLOps platform — every service (API + UI) containerized.
#
# Host ports are offset +100 from the local-dev ports so the containers can run
# alongside services started directly with uvicorn / ng serve:
#   UI               4200 -> 4300
#   data-management  8000 -> 8100
#   training         8001 -> 8101
#   model-registry   8002 -> 8102
#   prediction       8003 -> 8103
#
# MinIO (9000/9003) and MLflow (5000) keep their usual ports: they are only ever
# run inside Docker, so there is no local process to collide with.
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API (used by the services)
      - "9003:9001"   # web console (http://localhost:9003) — 9001 is taken by Penpot
    volumes:
      - minio_data:/data

  data-management:
    build: ./services/data-management
    depends_on:
      - minio
    environment:
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: datasets
      DVC_MODE: auto
      DVC_REMOTE_PATH: dvc
      DATA_DIR: /app/data
    ports:
      - "8100:8000"
    volumes:
      - data_repo:/app/data
    restart: on-failure

  # MLflow tracking server (Step 2). SQLite backend + volume artifacts;
  # upgraded to PostgreSQL + MinIO artifacts in Step 5.
  #
  # Pinned to 2.22.4 (last 2.x): the plan's later steps rely on classic
  # `models:/CatDogClassifier/Production` URIs + mlflow.register_model, which
  # MLflow 3.x replaced with "logged models" and doesn't store model files
  # as run artifacts on a plain filesystem root.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.4
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --artifacts-destination /mlflow/mlartifacts
      --serve-artifacts
    ports:
      - "5000:5000"   # MLflow UI + tracking API (http://localhost:5000)
    volumes:
      - mlflow_store:/mlflow
    restart: on-failure

  # Training service (Step 2). Pulls a dataset from the shared DVC repo
  # (the same `data_repo` volume that data-management owns), trains, and
  # records the run to MLflow. TensorFlow image is large (~2.8 GB) — same
  # caveat as prediction.
  training:
    build: ./services/training
    depends_on:
      - minio
      - mlflow
      - data-management
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATA_REPO: /app/data
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      REGISTER_MODEL_NAME: CatDogClassifier
    ports:
      - "8101:8001"
    volumes:
      - data_repo:/app/data
    restart: on-failure

  # Model Registry service (Step 3). Wraps the MLflow Model Registry so the
  # platform can version + stage CatDogClassifier models (Pending → Staging →
  # Production → Archived) and enforce the promotion gate. Keeps one small file
  # — the editable gate thresholds — in a named volume.
  model-registry:
    build: ./services/model-registry
    depends_on:
      - mlflow
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATA_DIR: /app/data
    ports:
      - "8102:8002"
    volumes:
      - registry_data:/app/data
    restart: on-failure

  # Prediction service (Step 4). Serves the current Production model
  # dynamically (models:/CatDogClassifier/Production) — reads the Registry
  # directly, same as model-registry. Prediction history is kept in SQLite
  # under a small named volume so it survives container restarts and is cleaned
  # the same way as the rest (`docker compose down -v`).
  prediction:
    build: ./services/prediction
    depends_on:
      - mlflow
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      REGISTER_MODEL_NAME: CatDogClassifier
      PREDICTIONS_DB_PATH: /app/data/predictions.db
    ports:
      - "8103:8003"
    volumes:
      - predictions_data:/app/data
    restart: on-failure

  # Angular UI, built with the production configuration (targets 8100-8103)
  # and served statically by nginx.
  ui:
    build: ./ui
    depends_on:
      - data-management
      - training
      - model-registry
      - prediction
    ports:
      - "4300:4200"
    restart: on-failure

volumes:
  minio_data:
  data_repo:
  mlflow_store:
  predictions_data:
  registry_data: