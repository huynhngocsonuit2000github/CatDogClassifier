# Step 1 infra: MinIO (S3 store) + the Data Management service.
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API (used by the service)
      - "9003:9001"   # web console (http://localhost:9003) — 9001 is taken by Penpot
    volumes:
      - minio_data:/data

  data-management:
    build: ./services/data-management
    depends_on:
      - minio
    environment:
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: datasets
      DVC_MODE: auto
      DVC_REMOTE_PATH: dvc
      DATA_DIR: /app/data
    ports:
      - "8000:8000"
    volumes:
      - data_repo:/app/data
    restart: on-failure

volumes:
  minio_data:
  data_repo: