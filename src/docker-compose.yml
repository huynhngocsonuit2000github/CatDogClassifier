# MLOps infra: MinIO (S3 store), MLflow (tracking), and the services.
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API (used by the service)
      - "9003:9001"   # web console (http://localhost:9003) — 9001 is taken by Penpot
    volumes:
      - minio_data:/data

  data-management:
    build: ./services/data-management
    depends_on:
      - minio
    environment:
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: datasets
      DVC_MODE: auto
      DVC_REMOTE_PATH: dvc
      DATA_DIR: /app/data
    ports:
      - "8000:8000"
    volumes:
      - data_repo:/app/data
    restart: on-failure

  # MLflow tracking server (Step 2). SQLite backend + volume artifacts;
  # upgraded to PostgreSQL + MinIO artifacts in Step 5.
  #
  # Pinned to 2.22.4 (last 2.x): the plan's later steps rely on classic
  # `models:/CatDogClassifier/Production` URIs + mlflow.register_model, which
  # MLflow 3.x replaced with "logged models" and doesn't store model files
  # as run artifacts on a plain filesystem root.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.4
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --artifacts-destination /mlflow/mlartifacts
      --serve-artifacts
    ports:
      - "5000:5000"   # MLflow UI + tracking API (http://localhost:5000)
    volumes:
      - mlflow_store:/mlflow
    restart: on-failure

volumes:
  minio_data:
  data_repo:
  mlflow_store: